    - symbol: TopAbs_Orientation
    - symbol: TopAbs_ShapeEnum
    - symbol: TopAbs_State
    - symbol: TopExp_Explorer
    - symbol: TopLoc_Location
    - symbol: TopoDS
    - symbol: TopoDS_Compound
    - symbol: TopoDS_Edge
    - symbol: TopoDS_Face
    - symbol: TopoDS_Shape
    - symbol: TopoDS_Shell
    - symbol: TopoDS_Solid
    - symbol: TopoDS_Vertex
    - symbol: TopoDS_Wire
    - symbol: gp_Ax1
    - symbol: gp_Ax2
    - symbol: gp_Circ
    - symbol: gp_Dir
    - symbol: gp_Pnt
    - symbol: gp_Quaternion
    - symbol: gp_Trsf
