# D0 leak-check build (issue #355): the D1 bindings the kernel and probes use, a 512 MiB memory cap,
# an exception-release helper and a heap counter. Built with the image pinned in leakcheck-build.mjs.
mainBuild:
  name: opencascade.d0-leakcheck.js
  bindings:
    - symbol: OCJS
    - symbol: Handle_IMeshTools_Context
    - symbol: BRepAlgoAPI_Algo
    - symbol: BRepAlgoAPI_BooleanOperation
    - symbol: BRepAlgoAPI_BuilderAlgo
