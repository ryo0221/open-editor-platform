    # D2 STEP (CAD11): AP214 geometry subset, writer and reader; files go through Emscripten FS.
    # Interface_Static is bound but its static setters are not exposed; the writer defaults
    # (AP214, millimetres) are used and the kernel test checks them in the file header.
    - symbol: IFSelect_ReturnStatus
    - symbol: Interface_Static
    - symbol: STEPControl_Reader
    - symbol: STEPControl_StepModelType
    - symbol: STEPControl_Writer
    - symbol: XSControl_Reader
    # D2 STEP import (CAD11/CAD13): the normalized BRep asset (BRepTools text format), written
    # once at import and read to evaluate. The sequence/string bindings were meant for the
    # reader's FileUnits but cannot be constructed without NCollection_BaseSequence; the import
    # reads the length unit from the file text instead (step-import.ts).
    - symbol: BRepTools
    - symbol: BRep_Builder
    - symbol: TColStd_SequenceOfAsciiString
    - symbol: TCollection_AsciiString
    - symbol: TopoDS_Builder
    # R1 (docs/cad/r1-modeling.md, Kernel build): shape history and topology maps for persistent
    # references, detail features, sketch curves, loft and sweep. Lists and maps are iterated by
    # copy + RemoveFirst and by index (FindKey), so no NCollection iterators are bound.
    - symbol: NCollection_BaseList
    - symbol: NCollection_BaseMap
    - symbol: TopTools_ListOfShape
    - symbol: TopTools_IndexedMapOfShape
    - symbol: TopTools_IndexedDataMapOfShapeListOfShape
    - symbol: TopExp
    - symbol: BRepTools_History
    - symbol: Handle_BRepTools_History
    - symbol: BRepFilletAPI_LocalOperation
    - symbol: BRepFilletAPI_MakeFillet
    - symbol: BRepFilletAPI_MakeChamfer
