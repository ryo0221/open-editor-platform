name: Temporary analysis prototype verification
on:
  push:
    branches:
      - prototype/fishbone-fta-20261123
    paths:
      - .github/workflows/analysis-prototype-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Install required fonts
        run: npm run fonts:fetch
      - name: Check TypeScript after browser test changes
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Analysis-specific Fishbone FTA and FMEA browser regression
        run: npx playwright test tests/e2e/structured-graph.spec.ts tests/e2e/issue2-data.spec.ts --grep "analysis prototype|FTA prototype|PFMEA prototype|DFMEA prototype" --reporter=list
      - name: Focused existing mobile Graph and history regression
        run: npx playwright test tests/e2e/structured-graph-mobile.spec.ts tests/e2e/keyboard-history-mobile.spec.ts --reporter=list
      - name: Check modified browser specs lint and formatting
        run: npx eslint tests/e2e/structured-graph.spec.ts tests/e2e/issue2-data.spec.ts && npx prettier --check tests/e2e/structured-graph.spec.ts tests/e2e/issue2-data.spec.ts
      - name: Show formatted test additions for review if checks fail
        if: failure()
        run: |
          npx prettier --write tests/e2e/structured-graph.spec.ts tests/e2e/issue2-data.spec.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const files = [
            ['GRAPH', 'tests/e2e/structured-graph.spec.ts', '/** Cross-domain analysis starters remain native Graphs;'],
            ['DATA', 'tests/e2e/issue2-data.spec.ts', "test('PFMEA prototype:"],
          ];
          for (const [tag, path, marker] of files) {
            const content = readFileSync(path, 'utf8');
            const index = content.indexOf(marker);
            if (index < 0) throw Error('Missing ' + tag + ' test marker');
            console.log('FORMAT_TAIL_' + tag + '=' + JSON.stringify(content.slice(index)));
          }
          NODE
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-prototype-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 2
