name: Temporary analysis prototype verification
on:
  push:
    branches:
      - prototype/fishbone-fta-20261123
    paths:
      - .github/workflows/analysis-prototype-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Install required fonts
        run: npm run fonts:fetch
      - name: Build production app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Related Graph and Data desktop/mobile regression
        run: npx playwright test tests/e2e/structured-graph.spec.ts tests/e2e/structured-graph-mobile.spec.ts tests/e2e/issue2-data.spec.ts tests/e2e/practical-data.spec.ts tests/e2e/keyboard-history.spec.ts tests/e2e/keyboard-history-mobile.spec.ts --reporter=list
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-prototype-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 2
