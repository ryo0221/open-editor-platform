    <circle cx="154" cy="302" r="7" fill="#174ec2" stroke="#174ec2"/>
    <text x="170" y="307" fill="#16243b" font-size="15" font-weight="700">新しいデッキ</text>
    <rect x="341" y="281" width="238" height="42" rx="7" fill="#ffffff" stroke="#cfdaea"/>
    <circle cx="357" cy="302" r="7" fill="#ffffff" stroke="#174ec2"/>
