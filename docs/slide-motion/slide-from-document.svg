<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="774" viewBox="0 0 1100 774" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">文書から作る</title>
  <desc id="desc">文書と保存版を選び、作成先と生成ページを確認してから新しいデッキを作る。</desc>
